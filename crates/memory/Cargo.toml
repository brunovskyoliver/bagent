[package]
name = "bagent-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
tracing    = "0.1"
tokio      = { version = "1", features = ["full"] }
rusqlite   = { version = "0.31", features = ["bundled"] }
uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

# Stage 1 lint waiver — owner: GitHub #25; reason: pre-existing memory lint
# debt is outside the acceptance-infrastructure-only scope; expires: 2026-09-17.
[lints.rust]
dead_code = "allow"

[lints.clippy]
unnecessary_map_or = "allow"
too_many_arguments = "allow"
await_holding_lock = "allow"
