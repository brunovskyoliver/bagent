[package]
name = "bagent-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
basert-connector = { path = "../connectors/basert" }
bagent-memory    = { path = "../memory" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
tracing    = "0.1"
tokio      = { version = "1", features = ["full"] }
uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

# Stage 1 lint waiver — owner: GitHub #25; reason: pre-existing agent lint debt
# is unrelated to Stage 1 acceptance infrastructure; expires: 2026-09-17.
[lints.clippy]
empty_line_after_doc_comments = "allow"
too_many_arguments = "allow"
bool_assert_comparison = "allow"
