[package]
name = "bagentd"
version = "0.1.0"
edition = "2021"

[features]
default = []
stage8-acceptance = []
stage7a-acceptance = []

[[bin]]
name = "bagentd"
path = "src/main.rs"

[dependencies]
basert-connector      = { path = "../connectors/basert" }
apple-mail-connector  = { path = "../connectors/apple_mail" }
apple-notes-connector  = { path = "../connectors/apple_notes" }
filesystem-connector  = { path = "../connectors/filesystem" }
codex-connector       = { path = "../connectors/codex" }
odoo-connector        = { path = "../connectors/odoo" }
whatsapp-connector    = { path = "../connectors/whatsapp" }
bagent-agent          = { path = "../agent" }
bagent-memory         = { path = "../memory" }
bagent-rules          = { path = "../rules" }
bagent-automations    = { path = "../automations" }
bagent-skills         = { path = "../skills" }
bagent-attachments    = { path = "../attachments" }

tokio       = { version = "1", features = ["full"] }
axum        = { version = "0.7", features = ["macros", "multipart"] }
tower       = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rusqlite    = { version = "0.31", features = ["bundled"] }
refinery    = { version = "0.8", features = ["rusqlite"] }
reqwest     = { version = "0.12", features = ["json", "stream"] }
url         = { version = "2", features = ["serde"] }
uuid        = { version = "1", features = ["v4"] }
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-stream = "0.1"
dirs        = "5"
chrono      = { version = "0.4", features = ["serde"] }
sha2        = "0.10"
unicode-normalization = "0.1"
hmac        = "0.12"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand_core   = { version = "0.6", features = ["getrandom"] }
secrecy     = "0.8"
zeroize     = "1"
base64      = "0.22"
notify      = { version = "6", features = ["macos_fsevent"] }
async-trait = "0.1"
scraper     = "0.27"
plist       = { version = "1.10", features = ["serde"] }
tempfile    = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"

# Stage 1 lint waiver — owner: GitHub #25; reason: pre-existing daemon lint
# debt is outside the acceptance-infrastructure-only scope; expires: 2026-09-17.
[lints.clippy]
nonminimal_bool = "allow"
collapsible_if = "allow"
single_match = "allow"
needless_question_mark = "allow"
items_after_test_module = "allow"
too_many_arguments = "allow"
