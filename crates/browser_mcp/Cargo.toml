[package]
name = "bagent-browser-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bagent-browser-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
